# A repository's public API against its latest published release
# (#1858). This stub is the repository's whole obligation for this
# subject: which legs run is repo-public-api.yml's business, so a leg
# the canon adds later reaches this repository on its next pin bump with
# nothing to edit here (#681). One workflow per subject, named for what
# a red means: a red in this run is an API change the version does not
# admit.
---
name: public-api

"on":
  schedule:
    # Mondays 06:00 UTC, beside the other subject stubs.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  public-api:
    permissions:
      contents: read # this repository's contents, read-only
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
    uses: monumental-archive/.github/.github/workflows/repo-public-api.yml@c54d16cf20d770a944db997afa533e48a786ee4e # v1.78.4
...
