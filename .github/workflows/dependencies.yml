# A repository's dependencies and the pins that fetch them, held to the
# live feeds and registries (#1858). This stub is the repository's whole
# obligation for this subject: which legs run is repo-dependencies.yml's
# business, so a leg the canon adds later reaches this repository on its
# next pin bump with nothing to edit here (#681). One workflow per
# subject, named for what a red means: a red in this run is a dependency
# or a pin that needs a decision.
---
name: dependencies

"on":
  schedule:
    # Mondays 06:00 UTC, beside the other subject stubs.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dependencies:
    permissions:
      contents: read # this repository's contents, read-only
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
    uses: monumental-archive/.github/.github/workflows/repo-dependencies.yml@b321a3359a64fa0cbc4e1f53d63de6eaa059f49f # v1.78.6
...
