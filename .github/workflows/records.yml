# A repository's links, best practices entry and regression-test report
# (#1858). This stub is the repository's whole obligation for this
# subject: which legs run is repo-records.yml's business, so a leg the
# canon adds later reaches this repository on its next pin bump with
# nothing to edit here (#681). One workflow per subject, named for what
# a red means: a red in this run is a record that no longer matches what
# it describes.
---
name: records

"on":
  schedule:
    # Mondays 06:00 UTC, beside the other subject stubs.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  records:
    permissions:
      contents: read # this repository's contents, read-only
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
    uses: monumental-archive/.github/.github/workflows/repo-records.yml@8f12d0df29386e9f3eb5221dcf14168c98c34b36 # v1.77.0
...
