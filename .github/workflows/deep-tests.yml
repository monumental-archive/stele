# A repository's fuzz targets, coverage floors and random-seed
# properties (#1858). This stub is the repository's whole obligation for
# this subject: which legs run is repo-deep-tests.yml's business, so a
# leg the canon adds later reaches this repository on its next pin bump
# with nothing to edit here (#681). One workflow per subject, named for
# what a red means: a red in this run is a test that found something.
---
name: deep-tests

"on":
  schedule:
    # Every night at 06:00 UTC (#1899): since #1897 keeps what a search
    # finds, search time accumulates, and nightly is the one schedule.
    - cron: 0 6 * * *
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deep-tests:
    permissions:
      contents: read # this repository's contents, read-only
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
    uses: monumental-archive/.github/.github/workflows/repo-deep-tests.yml@38eb388e9fb67ee13216dff37a1d0757851f8f15 # v1.79.0
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }} # the propose job's token (#1897)
...
