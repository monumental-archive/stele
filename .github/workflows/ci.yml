---
# The org gate. This stub is a repo's entire CI obligation: everything else
# (linters, versions, enforcement) arrives via the shared workflow and the
# toolbelt it pins. Update the SHA when moving to a newer gate; once the
# .github repo cuts releases, Renovate manages this pin like any other.
name: gate

"on":
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      # Stated, not inherited: a `uses:` job takes the workflow-level
      # default, never an ambient grant (the gate.yml convention).
      contents: read # checkout of this repo and of the toolbelt
    secrets:
      # Empty until the org CODECOV_TOKEN is ticked onto this repo —
      # the coverage-upload job skips clean on an absent token, so this
      # line is safe to carry ahead of the enrolment web steps.
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
    uses: monumental-archive/.github/.github/workflows/ci.yml@a0d05f53b7a937ea96bbeeed0f6f69e67a94df9d # v1.26.2
...
