# A repository's own audit:* tasks, each one run (#1858). This stub is
# the repository's whole obligation for this subject: which legs run is
# repo-own-audits.yml's business, so a leg the canon adds later reaches
# this repository on its next pin bump with nothing to edit here (#681).
# One workflow per subject, named for what a red means: a red in this
# run is one of the repository's own checks.
---
name: own-audits

"on":
  schedule:
    # Mondays 06:00 UTC, beside the other subject stubs.
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  own-audits:
    permissions:
      contents: read # this repository's contents, read-only
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
    uses: monumental-archive/.github/.github/workflows/repo-own-audits.yml@fc7e077dca7378fe88854de97cd9900617ab1f53 # v1.73.0
...
