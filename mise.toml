# Repo-specific tools and tasks only; the org belt arrives globally.
# ci is assembled by the toolbelt: define test/build/lint:* tasks here
# and they are collected automatically.

[settings]
lockfile = true

# Kept whatever else this file loses (canon #700). mise's
# `[task_config]` governs the file it is written in and layers
# nowhere, so the belt's own copy covers the belt's task bodies and
# reaches none of the ones below. The belt does set the same string as
# mise's default inline shell, which covers the gate and any machine
# wearing the belt; this line is what makes THIS file true without
# that layer — a bare clone, or anything that runs `mise run` with no
# belt in front of it.
#
# Not cosmetic. mise's own default is `sh`, which is dash on an Ubuntu
# runner: `[[ ]]` and `<<<` are syntax errors, and — the quiet half —
# a failing command inside a pipeline does not fail the task, so a
# check goes green having not checked. `lint:belt-shell` reds a config
# that defines tasks and omits this.
[task_config]
shell = "bash -euo pipefail -c"

[tools]
# The toolchain, exact-pinned; GOTOOLCHAIN=local below makes go.mod's
# `go` directive and this pin agree loudly instead of auto-downloading.
go = "1.27.0"
# govulncheck is a build input (audit:go-vulns asserts it with this
# remedy): no upstream binaries and no aqua package, so the go: backend
# builds it from a pinned source version with the toolchain above —
# the cargo-fuzz pattern, the belt's third documented backend
# exception (tooling-verdicts.md, #392).
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

# Hermetic by construction (#392): the build is a pure function of the
# tree — no cgo (one compiler, static output), no toolchain
# auto-download (the pin above is the only toolchain). These two are
# global; GOPROXY deliberately is not set anywhere: module fetches go
# through the checksummed public proxy and go.sum refuses any byte
# drift — the one accepted network dependency in the gate (the
# un-vendoring decision, recorded below and in CLAUDE.md).
[env]
CGO_ENABLED = "0"
GOTOOLCHAIN = "local"

# -trimpath keeps machine paths out of the binary (the reproducibility
# half). The first dependency (sigstore-go, the trust layer) was
# vendored for one afternoon and deliberately un-vendored: a committed
# vendor/ made REUSE.toml's aggregate annotation a false licensing
# claim over upstream code, and the honest alternative was per-module
# licence bookkeeping on every Renovate bump. go.sum keeps the
# integrity guarantee (byte-identical modules or a failed build); the
# build now fetches through the checksummed proxy, which is the one
# deliberate network dependency in the gate — CLAUDE.md records the
# decision.
[tasks.test]
description = "go test, race detector on"
# CGO_ENABLED=1 here and only here, measured: -race requires cgo on
# linux (the gate runner), and the race runtime is a TEST instrument —
# the shipped binary keeps the global CGO_ENABLED=0. Caught by the
# gate's first cloud run; darwin tolerates race without cgo, which is
# why the local run stayed green (stele#1).
env = { GOFLAGS = "-trimpath", CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks.build]
description = "Build every command"
env = { GOFLAGS = "-trimpath" }
run = "go build ./..."
