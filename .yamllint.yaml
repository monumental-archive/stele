---
# The org yamllint policy (#403): every rule from the full inventory, at
# maximum defensible enforcement, derived from the tool's own docs — the
# tree conforms to the tool, never the reverse. Preset levels that ship
# as warnings are raised to error, and the gate runs --strict so a
# warning could not hide anyway.
#
# The only departures from full strength, each with a reason about the
# RULE (reach-based reasons mean the layout is wrong, not the rule):
#   - key-ordering stays disabled: alphabetical keys destroy semantic
#     order (on/permissions/jobs). The same ruling as taplo's
#     reorder_keys and biome's useSortedKeys.
#   - indentation.check-multi-line-strings stays false: it applies YAML
#     indentation rules to the bash inside run: blocks. Reach-based, so
#     it carries a retirement trigger — #398 turns it on once #392
#     removes the shell from run: blocks.
#   - comments.min-spaces-from-content is 1, not the default 2: pinact
#     writes exactly one space before its version comment and is not
#     configurable — a belt-internal conflict, measured on ci.yml.
extends: default

rules:
  anchors:
    forbid-undeclared-aliases: true
    forbid-duplicated-anchors: true
    forbid-unused-anchors: true
  braces:
    # One mapping style: block. Empty {} stays legal — it is how a bare
    # workflow trigger writes "present, no options" honestly (null
    # otherwise, which empty-values forbids).
    forbid: non-empty
  brackets:
    forbid: non-empty
  comments:
    level: error
    min-spaces-from-content: 1
  comments-indentation:
    level: error
  document-end:
    present: true
  document-start:
    present: true
  empty-lines:
    max: 1
  empty-values: enable
  float-values:
    forbid-inf: true
    forbid-nan: true
    forbid-scientific-notation: true
    require-numeral-before-decimal: true
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
  key-duplicates:
    forbid-duplicated-merge-keys: true
  key-ordering: disable
  line-length:
    # 130 is derived, not chosen: the org's mandatory pin format
    # (`uses: <path>@<40-char-sha> # vX.Y.Z`, enforced by
    # lint:action-pins) produces unbreakable lines measured at up to 127
    # characters, and the trailing version comment defeats both
    # allow-non-breakable-* exemptions. 130 is the tightest cap the
    # mandatory format admits; per-language column rules tighter than
    # this belong to .editorconfig (max_line_length is per-type there,
    # global here).
    max: 130
    allow-non-breakable-inline-mappings: true
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  quoted-strings:
    quote-type: any
    required: only-when-needed
    check-keys: true
  truthy:
    level: error
    check-keys: true
...
