[default.extend-words]
# in-toto's attestation bundles are named `<artifact>.intoto.jsonl`. The
# filename is fixed by the in-toto spec, so it appears verbatim in prose
# (SECURITY-INSIGHTS.yml above all). `typos` reads it as "into".
intoto = "intoto"

[files]
# go.sum is nothing but hashes. Fuzz seed corpora are real foreign
# artifacts (bundles, certificates, trusted roots) recorded byte-for-
# byte — base64 blobs are not prose, and editing a seed to appease a
# spellchecker would falsify the evidence.
extend-exclude = ["go.sum", "internal/*/testdata/*-seed.*"]

[default]
# Go module pseudo-versions (v0.0.0-<stamp>-<hex12>) land in go.mod:
# the hex fragment is a commit hash, not a word.
extend-ignore-re = ["\\b[0-9]{14}-[0-9a-f]{12}\\b"]
